memory_limit = 256M

upload_max_filesize = 64M

post_max_size = 64M

max_execution_time = 120

max_input_time = 120

max_input_vars = 5000

output_buffering = 4096

session.name = PHPSESSID

expose_php = Off

opcache.enable = 1

opcache.enable_cli = 1

opcache.validate_timestamps = 0

opcache.memory_consumption = 128

opcache.interned_strings_buffer = 16

opcache.max_accelerated_files = 20000

; Use the Railway persistent volume for temporary PHP files.
; This keeps temporary files on the same filesystem as
; SuiteCRM cache files and avoids cross-filesystem rename failures.
sys_temp_dir = /var/www/html/tmp
